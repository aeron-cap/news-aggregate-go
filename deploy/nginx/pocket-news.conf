server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pocket-news.example.com;

    # HTTPS setup (replace pocket-news.example.com with your domain everywhere in this file):
    #   1. Point the domain's A record at the instance and allow ports 80 and 443 in the security group.
    #   2. sudo apt install certbot python3-certbot-nginx
    #   3. sudo certbot certonly --nginx -d pocket-news.example.com --deploy-hook "systemctl reload nginx"
    #   4. Install this file, then: sudo nginx -t && sudo systemctl reload nginx
    #   5. Renewal runs from certbot's systemd timer. Check it with: sudo certbot renew --dry-run
    ssl_certificate /etc/letsencrypt/live/pocket-news.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pocket-news.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /opt/pocket-news/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:6767/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 45s;
    }
}

# Plain HTTP only redirects. The session cookie is Secure, so the app doesn't work over http://.
server {
    listen 80;
    listen [::]:80;
    server_name pocket-news.example.com;

    location / {
        return 301 https://$host$request_uri;
    }
}
