# Per-client-IP limit on anonymous session creation (POST /api/set-token).
# Each call without a valid cookie inserts a users row, so keep it tight.
limit_req_zone $binary_remote_addr zone=set_token:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    root /opt/pocket-news/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/set-token {
        limit_req zone=set_token burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:6767/set-token;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:6767/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 45s;
    }
}
