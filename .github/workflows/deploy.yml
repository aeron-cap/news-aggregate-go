name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Only deploy pushes to main that passed CI, not pull request runs.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: production
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      TARBALL: pocket-news-${{ github.event.workflow_run.head_sha }}.tar.gz
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Go binaries
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ vars.DEPLOY_GOARCH || 'amd64' }}
        run: go build -trimpath -o release/ ./cmd/...
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Package release
        run: |
          mkdir -p release/frontend release/internal/database
          cp -r frontend/dist release/frontend/dist
          cp internal/database/resnik.py release/internal/database/
          cp requirements.txt release/
          tar -czf "$TARBALL" -C release .
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload release
        run: scp -i ~/.ssh/deploy_key "$TARBALL" "$DEPLOY_USER@$DEPLOY_HOST:"
      - name: Activate release
        run: ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$SHA" < deploy/scripts/deploy-release.sh
